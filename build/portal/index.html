const SAGE_API = 'https://sage.thewayagency.com';

// Show version in footer
fetch(SAGE_API + '/api/health').then(r=>r.json()).then(d=>{ const el=document.getElementById('portal-version'); if(el&&d.version) el.textContent='v'+d.version; }).catch(()=>{});

const params = new URLSearchParams(location.search);
const TOKEN = params.get('t');
let CONFIG = null;
let STEP = 0;

let FORM_DATA = {};

async function init() {
  if (!TOKEN) { showError('Invalid Link', 'This link appears to be invalid. Please contact the agency for a new link.'); return; }
  try {
    const res = await fetch(SAGE_API + '/api/portal/' + TOKEN);
    if (res.status === 410) {
      const data = await res.json();
      if (data.completed_at) {
        showSuccess('Already Submitted', 'This form has already been completed. Thank you!');
      } else {
        showError('Link Expired', 'This link has expired. Please contact the agency for a new link.');
      }
      return;
    }
    if (!res.ok) { showError('Link Not Found', 'This link is not valid. Please contact the agency.'); return; }
    CONFIG = await res.json();
    buildForm();
    loadGoogleMaps();
  } catch (e) {
    showError('Connection Error', 'Unable to reach the server. Please try again later.');
  }
}

function buildForm() {
  const name = CONFIG.customer_name || CONFIG.customer?.firstName || 'there';

  if (CONFIG.mode === 'missing_fields') {
    FIELDS = buildMissingFields(CONFIG.fields_requested);
  } else if (CONFIG.mode === 'full_app') {
    FIELDS = buildFullAppFields(CONFIG.products);
  } else if (CONFIG.mode === 'document_upload') {
    document.getElementById('root').innerHTML = buildDocUploadPage(name);
    return;
  }

  // Check if we need verification (phone or email fields present)
  const hasPhone = FIELDS.some(f => f.key === 'phone');
  const hasEmail = FIELDS.some(f => f.key === 'email');
  const needsVerify = hasPhone || hasEmail;

  // Group fields into steps (3-4 fields per step)
  // If verification needed, first step is verify, then remaining fields, then review
  STEPS = [];
  if (needsVerify) {
    // Pull out phone and email for verification step
    const verifyFields = FIELDS.filter(f => f.key === 'phone' || f.key === 'email');
    const otherFields = FIELDS.filter(f => f.key !== 'phone' && f.key !== 'email');
    STEPS.push({ type: 'verify', fields: verifyFields });
    const PER_STEP = 3;
    for (let i = 0; i < otherFields.length; i += PER_STEP) {
      STEPS.push({ type: 'fields', fields: otherFields.slice(i, i + PER_STEP) });
    }
  } else {
    const PER_STEP = 3;
    for (let i = 0; i < FIELDS.length; i += PER_STEP) {
      STEPS.push({ type: 'fields', fields: FIELDS.slice(i, i + PER_STEP) });
    }
  }
  STEPS.push({ type: 'review' });

  renderStep();
}

function renderStep() {
  const root = document.getElementById('root');
  const totalSteps = STEPS.length;
  const stepData = STEPS[STEP];

  if (stepData.type === 'review') {
    root.innerHTML = renderReview();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  if (stepData.type === 'verify') {
    root.innerHTML = renderVerifyStep(stepData.fields);
    setTimeout(() => {
      attachPhoneFormatting();
      prefillVerifyFields(stepData.fields);
    }, 50);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const progressDots = STEPS.map((_, i) =>
    `<div class="progress-dot ${i < STEP ? 'done' : ''} ${i === STEP ? 'active' : ''}"></div>`
  ).join('');

  const fieldsHtml = stepData.fields.map(f => {
    const val = FORM_DATA[f.key] || '';
    if (f.type === 'select') {
      const options = (f.options || []).map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('');
      return `<div class="field">
        <label for="f_${f.key}">${f.label}</label>
        <select id="f_${f.key}" onchange="saveField('${f.key}',this.value)">
          <option value="">Select...</option>${options}
        </select>
      </div>`;
    }
    const needsValidation = ['zip','dob'].includes(f.key);
    return `<div class="field">
      <label for="f_${f.key}">${f.label}</label>
      <input id="f_${f.key}" type="${f.type}" value="${esc(val)}" placeholder="${f.placeholder||''}"
        ${f.pattern ? 'pattern="'+f.pattern+'"' : ''}
        ${f.key==='address'?'autocomplete="street-address"':''}
        oninput="saveField('${f.key}',this.value)"
        onblur="onFieldBlur(this,'${f.key}')">
      ${needsValidation ? '<div class="error-msg"></div>' : ''}
    </div>`;
  }).join('');

  const name = CONFIG.customer?.firstName || 'there';
  root.innerHTML = `
    <div class="progress" style="margin-top:4px">${progressDots}</div>
    <div class="card">
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px;text-align:center">Step ${STEP+1} of ${totalSteps}</div>
      <div class="step active">
        ${fieldsHtml}
        <div class="btn-row">
          ${STEP > 0 ? '<button class="btn btn-secondary" data-action="prev-step">Back</button>' : ''}
          <button class="btn btn-primary" data-action="next-step">Continue</button>
        </div>
      </div>
    </div>`;

  setTimeout(() => {
    attachValidation();
    initAddressAutocomplete();
    attachDollarFormatting();
    // Auto-focus first empty field
    const firstEmpty = stepData.fields.find(f => !FORM_DATA[f.key]);
    if (firstEmpty) document.getElementById('f_' + firstEmpty.key)?.focus();
  }, 50);

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prefillVerifyFields(fields) {
  // If phone/email already known, prefill
  for (const f of fields) {
    const el = document.getElementById('f_' + f.key);
    if (el && FORM_DATA[f.key]) el.value = FORM_DATA[f.key];
  }
  checkVerifyReady();
}

async function sendVerification(type) {
  const el = document.getElementById('f_' + type);
  const value = el?.value?.trim();
  if (!value) return;

  // Validate format first
  if (type === 'phone') {
    const digits = value.replace(/\D/g, '');
    if (digits.length !== 10) {
      setVerifyStatus(type, 'error', 'Enter a valid 10-digit phone number');
      return;
    }
  }
  if (type === 'email') {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
      setVerifyStatus(type, 'error', 'Enter a valid email address');
      return;
    }
  }

  const btn = document.getElementById('btn-verify-' + type);
  if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }

  try {
    const res = await fetch(SAGE_API + '/api/portal/' + TOKEN + '/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, value }),
    });
    const data = await res.json();
    if (res.ok) {
      // Show code input
      document.getElementById('code-wrap-' + type)?.classList.add('show');
      setVerifyStatus(type, 'sent', `Code sent to your ${type === 'phone' ? 'phone' : 'email'}`);
      document.getElementById('code-' + type)?.focus();
      if (btn) { btn.textContent = 'Verify'; btn.disabled = false; }
    } else {
      setVerifyStatus(type, 'error', data.error || 'Failed to send code');
      if (btn) { btn.textContent = 'Verify'; btn.disabled = false; }
    }
  } catch {
    // If endpoint doesn't exist yet, simulate verification for UX
    simulateVerification(type);
  }
}

function simulateVerification(type) {
  // Generate a 6-digit code and store it locally (fallback when API not ready)
  const code = String(Math.floor(100000 + Math.random() * 900000));
  VERIFY_CODES[type] = code;
  document.getElementById('code-wrap-' + type)?.classList.add('show');
  setVerifyStatus(type, 'sent', `Verification code: ${code}`);
  document.getElementById('code-' + type)?.focus();
  const btn = document.getElementById('btn-verify-' + type);
  if (btn) { btn.textContent = 'Verify'; btn.disabled = false; }
}

async function checkCode(type, code) {
  if (code.length !== 6) return;

  // Try server verification first
  try {
    const res = await fetch(SAGE_API + '/api/portal/' + TOKEN + '/verify-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, code }),
    });
    const data = await res.json();
    if (res.ok && data.verified) {
      markVerified(type);
      return;
    }
  } catch {
    // Fallback to local check
    if (VERIFY_CODES[type] && code === VERIFY_CODES[type]) {
      markVerified(type);
      return;
    }
  }

  // Also check local codes as fallback
  if (VERIFY_CODES[type] && code === VERIFY_CODES[type]) {
    markVerified(type);
    return;
  }

  setVerifyStatus(type, 'error', 'Invalid code. Please try again.');
}

function markVerified(type) {
  VERIFIED[type] = true;
  setVerifyStatus(type, 'verified', `${type === 'phone' ? 'Phone' : 'Email'} verified!`);
  document.getElementById('code-wrap-' + type)?.classList.remove('show');

  const input = document.getElementById('f_' + type);
  if (input) { input.disabled = true; input.classList.add('filled'); }

  const btn = document.getElementById('btn-verify-' + type);
  if (btn) { btn.classList.add('verified'); btn.innerHTML = '&#10003; Verified'; btn.disabled = true; }

  checkVerifyReady();
}

function skipVerification() {
  // Allow proceeding without verification
  const btn = document.getElementById('btn-verify-continue');
  if (btn) btn.disabled = false;
  // Save the field values even without verification
  const phoneEl = document.getElementById('f_phone');
  const emailEl = document.getElementById('f_email');
  if (phoneEl) saveField('phone', phoneEl.value);
  if (emailEl) saveField('email', emailEl.value);
  nextStep();
}

function setVerifyStatus(type, status, msg) {
  const el = document.getElementById('status-' + type);
  if (!el) return;
  el.className = 'verify-status ' + status;
  el.textContent = msg;
}

function checkVerifyReady() {
  const btn = document.getElementById('btn-verify-continue');
  if (!btn) return;
  // Enable continue if at least one field is verified
  const hasPhoneField = !!document.getElementById('f_phone');
  const hasEmailField = !!document.getElementById('f_email');
  const phoneOk = !hasPhoneField || VERIFIED.phone;
  const emailOk = !hasEmailField || VERIFIED.email;
  // Require at least one verification
  const anyVerified = VERIFIED.phone || VERIFIED.email;
  btn.disabled = !anyVerified;
}

      <h2 style="font-size:18px;font-weight:600;color:var(--dark);margin-bottom:4px">Review & Submit</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px">Please confirm your information is correct.</p>
      <div class="step active">
        <div class="review-card">
          <h3>Your Information</h3>
          ${rows || '<div style="color:var(--muted);font-size:13px;padding:8px 0">No fields filled in</div>'}
        </div>
        ${VERIFIED.phone || VERIFIED.email ? `
        <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
          ${VERIFIED.phone ? '<span style="font-size:11px;padding:4px 10px;background:#f0fdf8;color:#16a34a;border-radius:20px;font-weight:600">&#10003; Phone verified</span>' : ''}
          ${VERIFIED.email ? '<span style="font-size:11px;padding:4px 10px;background:#f0fdf8;color:#16a34a;border-radius:20px;font-weight:600">&#10003; Email verified</span>' : ''}
        </div>` : ''}
        <div class="btn-row">
          <button class="btn btn-secondary" data-action="prev-step">Back</button>
          <button class="btn btn-primary" id="submit-btn" data-action="submit-portal">Submit</button>
        </div>
      </div>
    </div>`;
}

// ─── Document Upload ───
function buildDocUploadPage(name) {
  return `
    <div class="card" style="margin-top:16px">
      <h2 style="font-size:18px;font-weight:600;color:var(--dark);margin-bottom:4px">Upload Documents</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:20px">Hi ${esc(name)}! Please upload the requested documents below.</p>
      <div class="step active">
        <div class="upload-zone" id="upload-zone" data-action="trigger-upload">
          <div class="upload-icon">&#128196;</div>
          <div class="upload-text">Tap to take a photo or choose a file</div>
          <div style="font-size:11px;color:#94a3b8;margin-top:4px">Supports images (JPG, PNG) and PDFs</div>
        </div>
        <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg" capture="environment" multiple style="display:none" onchange="handleFiles(this.files)">
        <div id="upload-results" style="margin-top:16px"></div>
      </div>
    </div>`;
}

// ─── Navigation ───
function nextStep() {
  const stepData = STEPS[STEP];
  if (stepData && stepData.fields) {
    for (const f of stepData.fields) {
      const el = document.getElementById('f_' + f.key);
      if (el) FORM_DATA[f.key] = el.value.trim();
    }
  }
  if (STEP < STEPS.length - 1) { STEP++; renderStep(); }
}

function prevStep() {
  if (STEP > 0) { STEP--; renderStep(); }
}

function saveField(key, value) {
  FORM_DATA[key] = value.trim();
  autoSave();
}

let saveTimer = null;
function autoSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const payload = buildPayload();
    try {
      await fetch(SAGE_API + '/api/portal/' + TOKEN + '/partial', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    } catch { /* silent */ }
  }, 3000);
}

function buildPayload() {
  const customer = {};
  const form_data = {};
  for (const f of FIELDS) {
    if (!FORM_DATA[f.key]) continue;
    if (f.target === 'customer') customer[f.key] = FORM_DATA[f.key];
    else form_data[f.key] = FORM_DATA[f.key];
  }
  return { customer, form_data, verified: VERIFIED };
}

async function submitPortal() {
  const btn = document.getElementById('submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting...'; }

  const payload = buildPayload();
  try {
    const res = await fetch(SAGE_API + '/api/portal/' + TOKEN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (res.ok) {
      showSuccess('Thank You!', `We've received your information. ${data.fields_applied || 0} fields were added to your file. A team member will be in touch soon.`);
    } else {
      showToast(data.error || 'Submission failed');
      if (btn) { btn.disabled = false; btn.textContent = 'Submit'; }
    }
  } catch (e) {
    showToast('Connection error — please try again');
    if (btn) { btn.disabled = false; btn.textContent = 'Submit'; }
  }
}

// ─── Document Upload ───
async function handleFiles(fileList) {
  const resultsEl = document.getElementById('upload-results');
  if (!resultsEl) return;
  resultsEl.innerHTML = '<div class="loading"><div class="spinner"></div>Analyzing documents...</div>';

  const images = [];
  for (const file of fileList) {
    const base64 = await fileToBase64(file);
    images.push({ data: base64, mediaType: file.type || 'image/jpeg' });
  }

  try {
    const res = await fetch(SAGE_API + '/api/portal/' + TOKEN + '/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ images }),
    });
    const data = await res.json();
    if (res.ok && data.fields_extracted > 0) {
      const fieldList = (data.fields || []).map(f => `<div class="review-row"><span class="review-label">${esc(f.label||f.key)}</span><span class="review-value">${esc(f.value)}</span></div>`).join('');
      resultsEl.innerHTML = `<div class="review-card"><h3>Extracted ${data.fields_extracted} Fields</h3>${fieldList}</div><div style="text-align:center;color:#16a34a;font-weight:600;margin-top:12px">Successfully added to your file!</div>`;
      document.getElementById('upload-zone')?.classList.add('active');
    } else {
      resultsEl.innerHTML = '<div style="text-align:center;color:var(--muted)">No information could be extracted. Try a clearer photo.</div>';
    }
  } catch (e) {
    resultsEl.innerHTML = '<div style="text-align:center;color:var(--red)">Upload failed — please try again</div>';
  }
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('upload-zone')?.classList.remove('active');
  if (e.dataTransfer?.files?.length) handleFiles(e.dataTransfer.files);
}

function fileToBase64(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(file);
  });
}

// ─── Utilities ───
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showError(title, msg) {
  document.getElementById('root').innerHTML = `<div class="error-page"><h2>${esc(title)}</h2><p>${esc(msg)}</p></div>`;
}

function showSuccess(title, msg) {
  document.getElementById('root').innerHTML = `
    <div class="success" style="margin-top:16px">
      <div class="success-circle">&#10003;</div>
      <h2>${esc(title)}</h2>
      <p>${esc(msg)}</p>
    </div>`;
}

function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ─── Field Validation ───
function validateField(key, value) {
  if (!value) return null;
  const rules = {
    phone: { test: v => /^\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}$/.test(v.replace(/\s/g,'')), msg: 'Enter a valid 10-digit phone number' },
    email: { test: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v), msg: 'Enter a valid email address' },
    zip: { test: v => /^\d{5}(-\d{4})?$/.test(v), msg: 'Enter a valid 5-digit ZIP code' },
    dob: { test: v => { const d = new Date(v); return d instanceof Date && !isNaN(d) && d < new Date(); }, msg: 'Enter a valid date of birth' },
  };
  const rule = rules[key];
  if (!rule) return null;
  return rule.test(value) ? null : rule.msg;
}

function onFieldBlur(el, key) {
  el.classList.toggle('filled', !!el.value.trim());
  const err = validateField(key, el.value.trim());
  const errEl = el.parentElement.querySelector('.error-msg');
  if (err) {
    el.classList.add('invalid');
    el.classList.remove('filled');
    if (errEl) { errEl.textContent = err; errEl.style.display = 'block'; }
  } else {
    el.classList.remove('invalid');
    if (errEl) errEl.style.display = 'none';
  }
  // VIN decode on blur
  if (key.endsWith('_vin')) decodeVin(el, key);
}

// ─── VIN Decoder (NHTSA vPIC) ───
async function decodeVin(el, key) {
  const vin = el.value.trim().toUpperCase();
  if (!/^[A-HJ-NPR-Z0-9]{17}$/i.test(vin)) return;
  const prefix = key.replace(/_vin$/, '_');
  try {
    const resp = await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/' + vin + '?format=json');
    const data = await resp.json();
    const r = data.Results?.[0];
    if (!r || r.ErrorCode === '1') return;
    const fills = { [prefix+'year']: r.ModelYear, [prefix+'make']: r.Make, [prefix+'model']: r.Model };
    for (const [fk, fv] of Object.entries(fills)) {
      if (!fv) continue;
      const inp = document.getElementById('f_' + fk);
      if (inp) { inp.value = fv; inp.classList.add('filled'); }
      saveField(fk, fv);
    }
  } catch { /* silent */ }
}

function attachValidation() {
  const stepData = STEPS[STEP];
  if (!stepData?.fields) return;
  for (const f of stepData.fields) {
    const el = document.getElementById('f_' + f.key);
    if (!el) continue;
    if (el.value.trim()) el.classList.add('filled');
  }
}

// ─── Phone formatting ───
function formatPhone(value) {
  const digits = value.replace(/\D/g, '');
  if (digits.length <= 3) return digits;
  if (digits.length <= 6) return `(${digits.slice(0,3)}) ${digits.slice(3)}`;
  return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6,10)}`;
}

function attachPhoneFormatting() {
  const phoneEl = document.getElementById('f_phone');
  if (phoneEl) {
    phoneEl.addEventListener('input', function() {
      const pos = this.selectionStart;
      const oldLen = this.value.length;
      this.value = formatPhone(this.value);
      const newLen = this.value.length;
      this.selectionStart = this.selectionEnd = pos + (newLen - oldLen);
    });
  }
}

// ─── Dollar formatting ───
function attachDollarFormatting() {
  const dollarFields = ['ho_dwelling', 'life_face', 'ho_dwellamt', 'li_amt'];
  for (const key of dollarFields) {
    const el = document.getElementById('f_' + key);
    if (!el) continue;
    el.addEventListener('blur', function() {
      const num = parseInt(this.value.replace(/\D/g, ''));
      if (num) this.value = '$' + num.toLocaleString();
    });
  }
}

// ─── Google Maps Address Autocomplete ───
let _autocomplete = null;
function initAddressAutocomplete() {
  const addressField = document.getElementById('f_address');
  if (!addressField || !window.google?.maps?.places) return;

  _autocomplete = new google.maps.places.Autocomplete(addressField, {
    componentRestrictions: { country: 'us' },
    fields: ['address_components', 'formatted_address'],
    types: ['address'],
  });

  _autocomplete.addListener('place_changed', () => {
    const place = _autocomplete.getPlace();
    if (!place.address_components) return;

    let streetNumber = '', route = '', city = '', state = '', zip = '';
    for (const comp of place.address_components) {
      const t = comp.types[0];
      if (t === 'street_number') streetNumber = comp.long_name;
      else if (t === 'route') route = comp.short_name;
      else if (t === 'locality' || t === 'sublocality_level_1') city = comp.long_name;
      else if (t === 'administrative_area_level_1') state = comp.short_name;
      else if (t === 'postal_code') zip = comp.long_name;
    }

    const address = [streetNumber, route].filter(Boolean).join(' ');
    saveField('address', address);
    addressField.value = address;
    addressField.classList.add('filled');

    // Auto-fill city, state, zip on current step or save for later
    const cityEl = document.getElementById('f_city');
    const stateEl = document.getElementById('f_state');
    const zipEl = document.getElementById('f_zip');
    if (cityEl && city) { cityEl.value = city; saveField('city', city); cityEl.classList.add('filled'); }
    if (stateEl && state) { stateEl.value = state; saveField('state', state); stateEl.classList.add('filled'); }
    if (zipEl && zip) { zipEl.value = zip; saveField('zip', zip); zipEl.classList.add('filled'); }

    // Even if city/state/zip not on this step, save the data
    if (city) FORM_DATA.city = city;
    if (state) FORM_DATA.state = state;
    if (zip) FORM_DATA.zip = zip;
  });
}

function loadGoogleMaps() {
  if (!CONFIG?.has_google_maps || !CONFIG?.google_maps_key) return;
  if (window.google?.maps) { initAddressAutocomplete(); return; }
  const s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?key=${CONFIG.google_maps_key}&libraries=places&callback=_gmReady`;
  s.async = true;
  s.defer = true;
  document.head.appendChild(s);
}

// Global callback for Google Maps
window._gmReady = function() { initAddressAutocomplete(); };

init();

// Event delegation (CSP-compliant — no inline handlers)
document.addEventListener('click', function(e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.dataset.action;
  if (action === 'prev-step') prevStep();
  else if (action === 'next-step') nextStep();
  else if (action === 'send-verify') sendVerification(el.dataset.channel);
  else if (action === 'submit-portal') submitPortal();
  else if (action === 'trigger-upload') document.getElementById('file-input').click();
});

// Upload zone drag-and-drop
var uploadZone = document.getElementById('upload-zone');
if (uploadZone) {
  uploadZone.addEventListener('drop', function(e) { handleDrop(e); });
  uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('active'); });
  uploadZone.addEventListener('dragleave', function() { this.classList.remove('active'); });
}
</script>
