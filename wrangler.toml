# Cloudflare Workers configuration for The Way Agency
# Deploy: npx wrangler deploy
# Docs: https://developers.cloudflare.com/workers/

name = "thewayagency-workers"
compatibility_date = "2024-01-01"

# ─── Quote Worker ───
# Forwards quote form submissions to sage-server
[[workers]]
name = "thewayagency-quote"
main = "workers/quote.js"
routes = [
  { pattern = "thewayagency.com/api/quote", zone_name = "thewayagency.com" },
  { pattern = "www.thewayagency.com/api/quote", zone_name = "thewayagency.com" },
]

[workers.vars]
SAGE_API_URL = "https://sage.thewayagency.com"

# ─── Contact Worker ───
# Handles contact form submissions, sends email notification
[[workers]]
name = "thewayagency-contact"
main = "workers/contact.js"
routes = [
  { pattern = "thewayagency.com/api/contact", zone_name = "thewayagency.com" },
  { pattern = "www.thewayagency.com/api/contact", zone_name = "thewayagency.com" },
]

[workers.vars]
CONTACT_EMAIL = "hello@thewayagency.com"
