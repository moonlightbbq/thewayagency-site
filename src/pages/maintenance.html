<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Maintenance | The Way Agency</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#173358">
  <link rel="icon" href="/src/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="/src/assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.googletagmanager.com">
  <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://sage.thewayagency.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/base.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <style>
    .maint-progress{height:6px;background:var(--border);border-radius:3px;margin:24px 0;overflow:hidden}
    .maint-bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:3px;animation:maint-pulse 2s ease-in-out infinite;width:60%}
    @keyframes maint-pulse{0%,100%{opacity:1}50%{opacity:.5}}
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>
  <nav class="nav" id="nav">
    <div class="nav__inner">
      <a href="/" class="nav__logo" aria-label="Home">
        <picture><source srcset="/src/assets/images/logo-horizontal.webp" type="image/webp"><img src="/src/assets/images/logo-horizontal.png" alt="The Way Agency" style="height:40px;width:auto;"></picture>
      </a>
    </div>
  </nav>
  <main id="main" style="margin-top:var(--nav-height);min-height:60vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
    <div style="text-align:center;max-width:500px;">
      <div style="font-size:64px;margin-bottom:16px;">&#128296;</div>
      <h1 style="font-size:clamp(1.5rem,4vw,2rem);color:var(--navy);margin-bottom:8px;">Scheduled Maintenance</h1>
      <p style="color:var(--slate);font-size:var(--text-lg);line-height:1.6;">We're performing scheduled maintenance to improve our systems.</p>
      <p id="eta-text" style="color:var(--navy);font-weight:600;margin-top:8px;"></p>
      <div class="maint-progress"><div class="maint-bar"></div></div>
      <button id="check-status-btn" class="btn btn--primary" onclick="checkStatus()">Check Status</button>
      <div id="status-msg" style="margin-top:12px;font-size:13px;color:var(--slate);display:none" role="alert" aria-live="polite"></div>
      <p style="margin-top:24px;font-size:var(--text-sm);color:var(--slate);">Questions? Call or text <a href="tel:+15024135335" style="color:var(--blue);font-weight:500;">(502) 413-5335</a> (<a href="sms:+15024135335" style="color:var(--blue);">tap to text</a>) or email <a href="mailto:hello@thewayagency.com" style="color:var(--blue);">hello@thewayagency.com</a></p>
    </div>
  </main>
  <script>
  // Show ETA from URL param
  (function() {
    var params = new URLSearchParams(location.search);
    var eta = params.get('eta');
    if (eta) {
      var d = new Date(eta);
      if (!isNaN(d.getTime())) {
        document.getElementById('eta-text').textContent = 'Expected completion: ' + d.toLocaleString();
      }
    }
  })();

  function checkStatus() {
    var msg = document.getElementById('status-msg');
    var btn = document.getElementById('check-status-btn');
    btn.textContent = 'Checking...'; btn.disabled = true;
    msg.style.display = 'block'; msg.textContent = '';
    var ctrl = new AbortController();
    setTimeout(function() { ctrl.abort(); }, 5000);
    fetch('https://sage.thewayagency.com/api/status', { signal: ctrl.signal })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.maintenance) { msg.style.color = 'var(--amber,#d97706)'; msg.textContent = 'Maintenance is still in progress. Please check back soon.'; }
        else { msg.style.color = 'var(--green,#16a34a)'; msg.textContent = 'Systems are back online! Redirecting...'; setTimeout(function() { location.href = '/'; }, 2000); }
      })
      .catch(function() { msg.style.color = 'var(--amber,#d97706)'; msg.textContent = 'Still down. Please try again in a few minutes.'; })
      .finally(function() { btn.textContent = 'Check Status'; btn.disabled = false; });
  }
  </script>
</body>
</html>
