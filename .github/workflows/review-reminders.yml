name: Blog Review Reminders

# The daily half of the licensed review (owner decision 2026-10-02: approval is
# "Required - but if they do not approve, and are silent, then they get daily
# emails the 3 days leading up to publishing"). Publish Scheduled Blog Posts
# (publish-blog.yml) runs only Wed and Sat, so this sends the D-3, D-2 and D-1
# reminders (and the review request for a 'planned' post 1-3 days out) on
# every day. It runs ONLY that pass: it never publishes, syncs reviews or checks
# the queue. scripts/send-review-emails.js records each day's reminder on the
# calendar entry (final_reminder_dates), so a rerun the same day, or this run
# after the Wed/Sat publish run already sent today's, sends nothing.

on:
  schedule:
    # Daily at 13:00 UTC (9:00 AM EDT, 8:00 AM EST): three hours after the Wed/Sat
    # publish run (10:00 UTC), so on those days it finds that run's reminders
    # recorded and sends nothing twice.
    - cron: '0 13 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

# One group for both workflows: each reads and commits the calendar, so an
# overlap (a delayed publish run, a manual dispatch) would send a reviewer two
# reminders the same day and turn one run red on the refused push.
concurrency:
  group: blog-review-calendar
  cancel-in-progress: false

jobs:
  final-review-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Exit 0 = sent, or nothing was due. Exit 2 = a send failed or was only
      # queued (outbound paused), a reviewer cannot be reached (the content
      # owner was alerted), or a setting is missing. The step continues on error
      # so what it did send is committed below (and not resent); the last step
      # fails the run.
      - name: Send final review reminders
        id: remind
        continue-on-error: true
        env:
          SAGE_API_URL: ${{ secrets.SAGE_API_URL }}
          SAGE_REVIEW_URL: ${{ secrets.SAGE_REVIEW_URL }}
          SAGE_API_TOKEN: ${{ secrets.SAGE_API_TOKEN }}
          SAGE_CLIENT_ID: ${{ secrets.SAGE_CLIENT_ID }}
          BLOG_REVIEW_TOKEN_SECRET: ${{ secrets.BLOG_REVIEW_TOKEN_SECRET }}
        run: node scripts/send-review-emails.js --final-reminders

      # Commit the reminder dates (and any request this run sent). The push
      # goes through scripts/git-push-rebase.sh, as in publish-blog.yml: if main
      # moved meanwhile (SAGE, or the publish run), this commit is rebased onto
      # it and pushed only when nothing it changed was changed meanwhile;
      # otherwise NOTHING is pushed, this step fails, and the reminders it sent
      # are not recorded (the next run sends that day's again).
      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/content-calendar.json
          git diff --cached --quiet && exit 0
          git commit -m "daily: blog review reminders for $(date +%Y-%m-%d)"
          bash scripts/git-push-rebase.sh main

      - name: Fail the run if review reminders failed
        if: ${{ !cancelled() && steps.remind.outcome == 'failure' }}
        run: |
          echo "::error::Send final review reminders failed (see that step): a send failed or was only queued in SAGE, a reviewer cannot be reached (the content owner was alerted), or a setting is missing. A post whose reviewer was not reached does not publish until they approve it."
          exit 1
