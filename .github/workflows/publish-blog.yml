name: Publish Scheduled Blog Posts

on:
  schedule:
    # Wednesday + Saturday at 10:00 UTC (6:00 AM Eastern). Calendar runs
    # on a 2×/week cadence; running both days lets posts ship on the day
    # they're scheduled rather than waiting up to 4 days for a Wednesday.
    - cron: '0 10 * * 3,6'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

# One group for both workflows: each reads and commits the calendar, so an
# overlap (a delayed publish run, a manual dispatch) would send a reviewer two
# reminders the same day and turn one run red on the refused push. GitHub
# keeps one PENDING run per group: a third run queued while one runs and one
# waits replaces the waiting one (shown cancelled, grey). A dropped publish run
# leaves due posts for the next Wed/Sat run; dispatch it again by hand.
concurrency:
  group: blog-review-calendar
  cancel-in-progress: false

jobs:
  review-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Step 1: Send review emails: the request (~D-14), the D-7 reminder and
      # the D-3/D-2/D-1 reminders (those also run daily, review-reminders.yml).
      # Exit 0 = sent, or nothing was due. Exit 2 = a send FAILED or was only
      # queued (outbound paused), a reviewer cannot be reached (the content
      # owner was alerted), or BLOG_REVIEW_TOKEN_SECRET is unset or under 32
      # characters. The run must go red for it (the previous `if ... else ...`
      # swallowed every exit code, so a two-month 403 outage reported green on
      # every single run), but it must not stop today's approved posts. A post
      # whose review could not be requested is held until approved (owner
      # decision 2026-10-02; I8 below). So the step continues on error, the
      # publish below still runs, and the last step fails the run.
      - name: Send review emails
        id: review
        continue-on-error: true
        env:
          SAGE_API_URL: ${{ secrets.SAGE_API_URL }}
          # BL-07: the public SAGE address the "Review and approve in SAGE" link
          # opens (https). Optional: unset, SAGE_API_URL is used.
          SAGE_REVIEW_URL: ${{ secrets.SAGE_REVIEW_URL }}
          SAGE_API_TOKEN: ${{ secrets.SAGE_API_TOKEN }}
          SAGE_CLIENT_ID: ${{ secrets.SAGE_CLIENT_ID }}
          # BL-07: signs the review-request token SAGE verifies on the reviewer's
          # change request. Same value as BLOG_REVIEW_TOKEN_SECRET in the sage .env.
          # REQUIRED: unset (or under 32 characters), this step exits 2 before
          # sending anything, and the run goes red (after the publish).
          BLOG_REVIEW_TOKEN_SECRET: ${{ secrets.BLOG_REVIEW_TOKEN_SECRET }}
        run: node scripts/send-review-emails.js

      # Step 1b: Update Google reviews from sage public endpoint.
      # update-reviews.js exits 0 on data change, 1 on healthy no-change,
      # >1 on real failure. Treat both 0 and 1 as "commit the refreshed
      # status file" so cron-health is visible in git even when the API
      # reports no new reviews.
      - name: Update Google reviews
        id: google_reviews
        run: |
          set +e
          node scripts/update-reviews.js
          code=$?
          set -e
          if [ "$code" -le 1 ]; then
            echo "reviews_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "reviews_updated=false" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi

      # Step 2: Publish posts that are due today and approved by their licensed
      # reviewer. A due post without that approval is HELD (logged, unchanged,
      # not an error): the queue check below (I8) turns the run red for it.
      # Exit 0 = ran cleanly (published, held, or nothing due). Exit 3 = a due post was
      # put in 'error' (its changes, and every other change of the run, are
      # written): the step stays green so they are committed below, and the
      # queue check (I7) turns the run red afterwards. Anything else (2: an
      # approval could not be verified for want of the secret; 1: the script
      # crashed) fails the step, and nothing it may have half-written is committed.
      - name: Publish scheduled posts
        id: publish
        env:
          # BL-07: verifies SAGE's signature on an approval (approval_mac) and
          # signs the credit record the renderer checks before it prints
          # "Reviewed by". Same secret as the review step above.
          # The renderer needs it too, as a Cloudflare Pages build variable: set
          # it for the PRODUCTION environment only. Pages runs every pushed
          # branch's own code in Preview, and a branch build that can read the
          # secret can print it and sign an approval or credit that verifies on
          # main. scripts/generate-blog.js credits no one in a Preview build and
          # warns if the secret is there (then remove it and rotate it).
          BLOG_REVIEW_TOKEN_SECRET: ${{ secrets.BLOG_REVIEW_TOKEN_SECRET }}
        run: |
          set +e
          node scripts/publish-scheduled-posts.js
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) ;;
            3) echo "::warning::A scheduled post was put in 'error'; the queue health check below reports it (I7)." ;;
            *) exit "$code" ;;
          esac

      # Step 3: Commit whatever the steps above changed (review status updates,
      # published posts, credit records, Google reviews). It no longer depends
      # on which step reported output: a run where only the publisher changed
      # files (a publish, a stripped review line, an 'error') used to throw them
      # away. It runs after a failed review or reviews step too (their writes,
      # e.g. review_sent_date for emails already sent, should not be lost and
      # resent), but not after a failed publish step.
      # The push goes through scripts/git-push-rebase.sh. If main moved while
      # this run worked, the run's commit is rebased onto it and pushed only when
      # nothing it changed was changed meanwhile (same lines, or the same
      # calendar entry or post file on other lines) and main was not rewritten.
      # Otherwise NOTHING is pushed and this step fails: today's publish waits
      # for the next run, and the review_sent_date / reminder_sent writes are
      # lost, so those emails go out again on that run. Start it with "Run
      # workflow" (or wait for the schedule); "Re-run jobs" replays this run's
      # stale commit and fails the same way.
      - name: Commit and push
        if: ${{ !cancelled() && steps.publish.outcome != 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/content-calendar.json data/locations.json data/testimonials.json data/google-reviews-status.json src/blog/
          git diff --cached --quiet && exit 0
          git commit -m "weekly: blog publish + Google review sync for $(date +%Y-%m-%d)"
          # SAGE commits to main directly (approvals, rejects, the content
          # queue). Rebase onto what landed meanwhile and retry; a conflict is
          # never auto-resolved, it fails this step with nothing pushed.
          bash scripts/git-push-rebase.sh main

      # Step 4: Queue health. Runs LAST so it never blocks today's publish --
      # its job is to alarm about slots that are about to fail, not to stop
      # content that is ready. I4 (a post inside 10 days with no markdown on
      # disk) is the check that would have caught college-student-auto-insurance
      # on 2026-08-03 instead of this workflow going red on 08-15. I2b (a date
      # that will publish nothing) is equally worth a red run, and so is I6 (a
      # post on a reviewer's change-request hold has reached its date and is
      # not publishing until the reviewer approves a version in SAGE or the hold is released),
      # and I7 (an entry the publisher put in 'error': missing or unready markdown,
      # or an approval in SAGE whose bytes, byline or signature no longer match,
      # or a status neither repo knows; the publish step stays green so its
      # changes are committed first), and I8 (a post due without its licensed
      # reviewer's approval, held: owner decision 2026-10-02; it clears when the
      # reviewer approves, and the post then publishes on the next run).
      # I9 (BLOG-06) is fatal too: the calendar's queue_pause is malformed, has
      # no "until", or runs more than 90 days. A valid pause is quiet: I1/I2/I2b
      # skip its dates, so a deliberate pause never turns this run red.
      # Deliberately NOT fatal: I5 (thin backlog) is a planning signal.
      # It does not run when Commit and push failed (a refused push): the run is
      # already red, and the working tree is not what main holds.
      - name: Queue health
        run: node scripts/queue-status.js --fail-on I4,I2b,I6,I7,I8,I9

      # Step 5: The review step continues on error so it cannot stop a publish
      # (step 1); its failure still turns the run red, here, after everything
      # else has run and been committed.
      - name: Fail the run if review emails failed
        if: ${{ !cancelled() && steps.review.outcome == 'failure' }}
        run: |
          echo "::error::Send review emails failed (see that step): a send failed or was only queued in SAGE, a reviewer cannot be reached (the content owner was alerted), or BLOG_REVIEW_TOKEN_SECRET is unset or under 32 characters. Due approved posts were still published; a post whose reviewer was not reached is held until they approve it."
          exit 1
