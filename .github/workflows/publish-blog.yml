name: Publish Scheduled Blog Posts

on:
  schedule:
    # Wednesday + Saturday at 10:00 UTC (6:00 AM Eastern). Calendar runs
    # on a 2×/week cadence; running both days lets posts ship on the day
    # they're scheduled rather than waiting up to 4 days for a Wednesday.
    - cron: '0 10 * * 3,6'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  review-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Step 1: Send review emails for posts due in ~2 weeks
      - name: Send review emails
        id: review
        env:
          SAGE_API_URL: ${{ secrets.SAGE_API_URL }}
          SAGE_API_TOKEN: ${{ secrets.SAGE_API_TOKEN }}
        run: |
          if node scripts/send-review-emails.js; then
            echo "reviews_sent=true" >> "$GITHUB_OUTPUT"
          else
            echo "reviews_sent=false" >> "$GITHUB_OUTPUT"
          fi

      # Step 1b: Update Google reviews from sage public endpoint.
      # update-reviews.js exits 0 on data change, 1 on healthy no-change,
      # >1 on real failure. Treat both 0 and 1 as "commit the refreshed
      # status file" so cron-health is visible in git even when the API
      # reports no new reviews.
      - name: Update Google reviews
        id: google_reviews
        run: |
          set +e
          node scripts/update-reviews.js
          code=$?
          set -e
          if [ "$code" -le 1 ]; then
            echo "reviews_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "reviews_updated=false" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi

      # Step 1c: Sync the sage-canonical producer roster (title/phone only) into
      # team.json from the public /api/public/team endpoint. Same exit convention as
      # update-reviews: 0 = changed, 1 = healthy no-change, >1 = real failure.
      - name: Sync producer roster
        id: roster_sync
        run: |
          set +e
          node scripts/sync-catalogs.js
          code=$?
          set -e
          if [ "$code" -le 1 ]; then
            echo "roster_synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "roster_synced=false" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi

      # Step 2: Publish posts that are due today
      - name: Publish scheduled posts
        id: publish
        run: |
          if node scripts/publish-scheduled-posts.js; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No posts due today. Nothing to deploy."
          fi

      # Step 3: Commit any changes (review status updates + published posts)
      - name: Commit and push
        if: steps.review.outputs.reviews_sent == 'true' || steps.publish.outputs.published == 'true' || steps.google_reviews.outputs.reviews_updated == 'true' || steps.roster_sync.outputs.roster_synced == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/content-calendar.json data/locations.json data/testimonials.json data/google-reviews-status.json data/team.json data/team-sync-status.json src/blog/
          git diff --cached --quiet && exit 0
          git commit -m "weekly: blog publish + Google review sync for $(date +%Y-%m-%d)"
          git push
