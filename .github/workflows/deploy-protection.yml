name: Deploy Protection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The test suite. It was in NO workflow — `npm test` was runnable only by hand, so
  # tests/intake-gate.test.js (which drives the real intake form through jsdom and is
  # the only thing standing between us and silently paging a producer about a lead we
  # are not licensed to write) would have rotted without anyone noticing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 29 requires ^20.19 || ^22.13 || >=24 — the '18' the other jobs
          # pin would not even load the test harness.
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Check data integrity
        run: node scripts/check-data-integrity.js

  safe-build:
    runs-on: ubuntu-latest
    needs: data-integrity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Pre-build checks
        run: node scripts/pre-build-check.js
      - name: Build site
        run: node scripts/build.js
      - name: Validate build
        run: node scripts/validate-build.js

  content-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Content guard (warning only)
        run: node scripts/content-backup.js guard || echo "::warning::Content guard detected potential data loss"
        continue-on-error: true

  blog-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build site (needed for blog validation)
        run: node scripts/build.js
      - name: Check blog feed
        run: test -f build/blog/feed.xml && echo "RSS feed exists" || exit 1
      - name: Check blog index
        run: test -f build/blog/index.html && echo "Blog index exists" || exit 1

  analytics-validation:
    runs-on: ubuntu-latest
    needs: data-integrity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Validate API documentation
        run: node -e "const d=JSON.parse(require('fs').readFileSync('data/sage-api-docs.json','utf8')); if(!d.endpoints||d.endpoints.length===0) process.exit(1); console.log(d.endpoints.length+' endpoints documented')"
      - name: Run data integrity with cross-references
        run: node scripts/check-data-integrity.js
      - name: Build and verify carrier pages
        run: |
          node scripts/build.js
          test -d build/carriers && echo "Carrier pages built" || exit 1
          test -f build/carriers/index.html && echo "Carrier index exists" || exit 1
      - name: Check asset integrity
        run: node scripts/check-assets.js
